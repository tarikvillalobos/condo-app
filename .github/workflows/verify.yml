name: Verify Condo App
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  shared-and-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - run: python3 scripts/check-history.py
      - run: xvfb-run -a ./gradlew :domain:desktopTest :demo:desktopTest :app:desktopTest :androidApp:assembleDebug
      - run: ./gradlew -PappEnvironment=production :app:compileKotlinDesktop :androidApp:assembleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-and-screenshots
          path: |
            **/build/reports/tests
            app/build/validation
            androidApp/build/outputs/apk/debug
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

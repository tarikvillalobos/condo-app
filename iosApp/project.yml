name: CondoApp
options:
  bundleIdPrefix: app.condo
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CONDO_BRAND: condo
    CONDO_ENVIRONMENT: demo
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: Condo App
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_NSFaceIDUsageDescription: Acesse sua conta com a autenticação do dispositivo.
    FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../app/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
    OTHER_LDFLAGS: $(inherited) -framework CondoApp
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  CondoApp:
    type: application
    platform: iOS
    sources:
      - CondoApp.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.condo.resident
    preBuildScripts:
      - name: Build shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/.."
          ./gradlew -Pbrand="$CONDO_BRAND" -PappEnvironment="$CONDO_ENVIRONMENT" :app:embedAndSignAppleFrameworkForXcode
  CondoAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: CondoApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.condo.resident.uitests
        TEST_TARGET_NAME: CondoApp
        OTHER_LDFLAGS: ""
schemes:
  CondoApp:
    build:
      targets:
        CondoApp: all
        CondoAppUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - name: CondoAppUITests
          parallelizable: false
